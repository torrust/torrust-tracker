[package]
description = "A library with the primitive types shared by the Torrust tracker packages."
keywords = [ "api", "library", "primitives" ]
name = "torrust-tracker-primitives"
readme = "README.md"

authors.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
bittorrent-peer-id = { version = "3.0.0-develop", path = "../peer-id" }
binascii = "0"
bittorrent-primitives = "0.2.0"
derive_more = { version = "2", features = [ "constructor" ] }
serde = { version = "1", features = [ "derive" ] }
tdyne-peer-id = "1"
tdyne-peer-id-registry = "0"
thiserror = "2"
torrust-tracker-clock = { version = "3.0.0-develop", path = "../clock" }
url = "2.5.4"

[dev-dependencies]
rstest = "0.25.0"
