[package]
categories = [ "data-structures", "network-programming" ]
description = "A library with the primitive types shared by the Torrust tracker packages."
keywords = [ "announce", "bittorrent", "info-hash", "peer", "swarm" ]
name = "torrust-tracker-primitives"
readme = "README.md"

authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version = "3.1.0"

[lints]
workspace = true

[dependencies]
torrust-peer-id = "0.1.0"
binascii = "0"
torrust-info-hash = "=0.2.0"
derive_more = { version = "2", features = [ "constructor", "display" ] }
serde = { version = "1", features = [ "derive" ] }
tdyne-peer-id = "1"
tdyne-peer-id-registry = "0"
thiserror = "2"
torrust-net-primitives = "0.1.0"
torrust-clock = "3.0.0"
url = "2"

[dev-dependencies]
quickcheck = { version = "1", default-features = false }
quickcheck_macros = "1"
serde_json = "1"

[package.metadata.cargo-machete]
# The `#[quickcheck]` attribute expands to code that calls the `quickcheck` crate, which machete cannot see.
ignored = [ "quickcheck" ]
