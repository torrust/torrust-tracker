[package]
categories = [ "data-structures", "network-programming" ]
description = "A library with the primitive types shared by the Torrust tracker packages."
keywords = [ "announce", "bittorrent", "info-hash", "peer", "swarm" ]
name = "torrust-tracker-primitives"
readme = "README.md"

authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version = "3.1.0"

[lints]
workspace = true

[features]
default = [  ]
# Test support outside the semver guarantees of this package: the peer fixture in `peer::fixture` (`PeerBuilder`,
# `qbittorrent_peer_id` and the `Default` impls of `Peer` and `peer::Id`), which the tests of other workspace packages
# use. Never enable it from a `[dependencies]` entry.
testing = [  ]

[dependencies]
torrust-peer-id = "0.1.0"
binascii = "0"
torrust-info-hash = "=0.2.0"
derive_more = { version = "2", features = [ "constructor", "display" ] }
serde = { version = "1", features = [ "derive" ] }
tdyne-peer-id = "1"
tdyne-peer-id-registry = "0"
thiserror = "2"
torrust-net-primitives = "0.1.0"
torrust-clock = "3.0.0"
url = "2"

[dev-dependencies]
quickcheck = { version = "1", default-features = false }
quickcheck_macros = "1"
serde_json = "1"
torrust-tracker-primitives = { path = ".", features = [ "testing" ] }

[package.metadata.cargo-machete]
# The self dev-dependency only turns on the `testing` feature for this package's own tests (ADR
# 20261021190318, rule A.3); no code names the crate by its package name, so machete cannot see the use.
ignored = [ "torrust-tracker-primitives" ]
