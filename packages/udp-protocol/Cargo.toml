[package]
categories = [ "network-programming", "parser-implementations" ]
description = "Types and functions for the BitTorrent UDP tracker protocol (BEP 15)."
keywords = [ "announce", "bep15", "bittorrent", "scrape", "udp" ]
name = "torrust-tracker-udp-protocol"
readme = "README.md"

authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[lints]
workspace = true

[features]
default = [  ]

[dependencies]
torrust-peer-id = { version = "0.1.0", features = [ "zerocopy" ] }
byteorder = "1"
either = "1"
zerocopy = { version = "0.8", features = [ "derive" ] }

[dev-dependencies]
pretty_assertions = "1"
quickcheck = "1"
quickcheck_macros = "1"
