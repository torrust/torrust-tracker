[package]
authors.workspace = true
description = "A library with the core functionality needed to implement a BitTorrent UDP tracker."
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords = [ "api", "bittorrent", "core", "library", "tracker" ]
license.workspace = true
name = "torrust-tracker-udp-core"
publish.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[dependencies]
torrust-info-hash = "=0.2.0"
torrust-tracker-core = { version = "0.1.0", path = "../tracker-core" }
torrust-tracker-udp-protocol = { version = "0.1.0", path = "../udp-protocol" }
blowfish = "0"
cipher = "0.5"
futures = "0"
rand = "0.9"
serde = "1.0.219"
thiserror = "2"
tokio = { version = "1", features = [ "macros", "net", "rt-multi-thread", "signal", "sync", "time" ] }
tokio-util = "0.7.15"
torrust-clock = "3.0.0"
torrust-tracker-configuration = { version = "3.0.0", path = "../configuration" }
torrust-tracker-events = { version = "0.1.0", path = "../events" }
torrust-metrics = "0.1.0"
torrust-net-primitives = "0.1.0"
torrust-tracker-primitives = { version = "3.0.0", path = "../primitives" }
torrust-tracker-swarm-coordination-registry = { version = "0.1.0", path = "../swarm-coordination-registry" }
tracing = "0"
zerocopy = "0.8"
async-trait = "0"

[dev-dependencies]
criterion = { version = "0.5.1", features = [ "async_tokio" ] }
mockall = "0"

[[bench]]
harness = false
name = "udp_tracker_core_benchmark"

[[bench]]
harness = false
name = "ban_service_benchmark"
