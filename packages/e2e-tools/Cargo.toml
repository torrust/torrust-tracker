[package]
description = "E2E test runners and developer profiling tools for the Torrust Tracker."
keywords = [ "bittorrent", "e2e", "profiling", "testing", "tracker" ]
name = "torrust-tracker-e2e-tools"
readme = "README.md"

authors.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[lints]
workspace = true

[dependencies]
anyhow = "1"
tokio = { version = "1", features = [ "macros", "rt-multi-thread" ] }
torrust-tracker = { version = "3.0.0-develop", path = "../../" }
