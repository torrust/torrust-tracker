[package]
name = "aquatic_peer_id"
version = "0.9.0"
description = "BitTorrent peer ID handling (internal fork of aquatic_peer_id 0.9.0)"
edition.workspace = true
license = "Apache-2.0"
readme = "README.md"
rust-version.workspace = true

[features]
default = [ "quickcheck" ]

[dependencies]
compact_str = "0.7"
hex = "0.4"
quickcheck = { version = "1", optional = true }
regex = "1"
serde = { version = "1", features = [ "derive" ] }
zerocopy = { version = "0.7", features = [ "derive" ] }
