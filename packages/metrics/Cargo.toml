[package]
description = "Prometheus metrics integration library providing type-safe metric collection and aggregation."
keywords = [ "api", "library", "metrics" ]
name = "torrust-metrics"
readme = "README.md"

authors.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
chrono = { version = "0", default-features = false, features = [ "clock" ] }
derive_more = { version = "2", features = [ "constructor" ] }
openmetrics-parser = "0.4.4"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1.0.140"
thiserror = "2"
torrust-tracker-clock = { version = "3.0.0-develop", path = "../clock" }
tracing = "0.1.41"

[dev-dependencies]
approx = "0.5.1"
formatjson = "0.3.1"
mutants = "0.0.3"
pretty_assertions = "1.4.1"
rstest = "0.25.0"
