[package]
description = "A library providing helpers for testing the Torrust tracker."
keywords = [ "helper", "library", "testing" ]
name = "torrust-tracker-test-helpers"
readme = "README.md"

authors.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version = "3.0.0"

[lints]
workspace = true

[dependencies]
rand = "0"
torrust-tracker-client-lib = { version = "0.1.0", path = "../tracker-client" }
torrust-tracker-configuration = { version = "3.0.0", path = "../configuration" }
torrust-tracker-http-protocol = { version = "0.1.0", path = "../http-protocol" }
torrust-tracker-udp-protocol = { version = "0.1.0", path = "../udp-protocol" }
torrust-info-hash = "=0.2.0"
torrust-peer-id = "0.1.0"
tracing = "0"
tracing-subscriber = { version = "0", features = [ "json" ] }
url = "2"
