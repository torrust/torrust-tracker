[package]
description = "Test-only tracker executable with one component that never stops, to verify the shutdown deadline abort."
keywords = [ "bittorrent", "shutdown", "testing", "tracker" ]
name = "torrust-tracker-hung-component-tracker"
readme = "README.md"

authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[lints]
workspace = true

[[bin]]
name = "hung-component-tracker"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = [ "derive" ] }
tokio = { version = "1", features = [ "macros", "rt-multi-thread" ] }
torrust-tracker = { version = "3.0.0-develop", path = "../../" }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31.3", default-features = false, features = [ "signal" ] }
tempfile = "3.27.0"
