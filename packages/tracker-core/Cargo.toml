[package]
authors.workspace = true
description = "A library with the core functionality needed to implement a BitTorrent tracker."
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords = [ "api", "bittorrent", "core", "library", "tracker" ]
license.workspace = true
name = "torrust-tracker-core"
publish.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = [  ]
db-compatibility-tests = [  ]

[dependencies]
async-trait = "0"
bittorrent-primitives = "0.2.0"
chrono = { version = "0", default-features = false, features = [ "clock" ] }
derive_more = { version = "2", features = [ "as_ref", "constructor", "from" ] }
mockall = "0"
rand = "0.9"
serde = { version = "1", features = [ "derive" ] }
serde_json = { version = "1", features = [ "preserve_order" ] }
sqlx = { version = "0.8", features = [ "macros", "mysql", "postgres", "runtime-tokio-native-tls", "sqlite" ] }
thiserror = "2"
tokio = { version = "1", features = [ "macros", "net", "rt-multi-thread", "signal", "sync" ] }
tokio-util = "0.7.15"
torrust-clock = "3.0.0"
torrust-tracker-configuration = { version = "3.0.0-develop", path = "../configuration" }
torrust-tracker-events = { version = "3.0.0-develop", path = "../events" }
torrust-located-error = { version = "3.0.0-develop", path = "../located-error" }
torrust-metrics = { version = "3.0.0-develop", path = "../metrics" }
torrust-tracker-primitives = { version = "3.0.0-develop", path = "../primitives" }
torrust-tracker-swarm-coordination-registry = { version = "3.0.0-develop", path = "../swarm-coordination-registry" }
tracing = "0"

[dev-dependencies]
mockall = "0"
testcontainers = "0"
torrust-tracker-test-helpers = { version = "3.0.0-develop", path = "../test-helpers" }
url = "2.5.4"
