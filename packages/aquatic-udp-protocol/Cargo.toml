[package]
name = "aquatic_udp_protocol"
version = "0.9.0"
description = "UDP BitTorrent tracker protocol (internal fork of aquatic_udp_protocol 0.9.0)"
keywords = [ "bittorrent", "peer-to-peer", "protocol", "torrent", "udp" ]
edition.workspace = true
license = "Apache-2.0"
readme = "README.md"
rust-version.workspace = true

[dependencies]
aquatic_peer_id = { version = "0.9.0", path = "../aquatic-peer-id" }
byteorder = "1"
either = "1"
zerocopy = { version = "0.8", features = [ "derive" ] }

[dev-dependencies]
pretty_assertions = "1"
quickcheck = "1"
quickcheck_macros = "1"
