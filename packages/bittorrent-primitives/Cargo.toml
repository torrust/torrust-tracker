# Internal fork of bittorrent-primitives 0.1.0.
# Source: https://crates.io/crates/bittorrent-primitives/0.1.0
# Author: Jose Celano <josecelano@gmail.com>
# License: MIT OR Apache-2.0
#
# Changes from the original:
# - bittorrent_udp_tracker_protocol dependency changed to the workspace udp-protocol crate
# - zerocopy bumped from 0.7 to 0.8
# - src/info_hash.rs: read_from -> read_from_bytes (zerocopy 0.8 API)
# - publish = false (temporary internal patch, not intended for crates.io)
# - step 4c: InfoHash no longer depends on bittorrent-udp-tracker-protocol or zerocopy

[package]
name = "bittorrent-primitives"
description = "collections of basic types for BitTorrent projects (internal fork patching zerocopy 0.8 compatibility)"
readme = "README.md"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = [ "Jose Celano <josecelano@gmail.com>" ]
repository = "https://github.com/torrust/bittorrent-primitives"
publish = false

[dependencies]
binascii = "0.1.4"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1.0.132"
thiserror = "1.0.65"
