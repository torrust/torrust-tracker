[package]
authors.workspace = true
categories = [ "web-programming::http-server", "asynchronous" ]
description = "Shared Axum server infrastructure for Torrust HTTP servers: listener timeouts, graceful shutdown and TLS configuration."
edition.workspace = true
homepage.workspace = true
keywords = [ "axum", "graceful-shutdown", "http", "timeout", "tls" ]
license.workspace = true
name = "torrust-tracker-axum-server"
publish.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[lints]
workspace = true

[dependencies]
axum-server = { version = "0.9", features = [ "tls-rustls-no-provider" ] }
camino = { version = "1", features = [ "serde", "serde1" ] }
hyper-util = { version = "0", features = [ "http1", "http2", "tokio" ] }
thiserror = "2"
tokio = { version = "1", features = [ "macros", "net", "rt-multi-thread", "signal", "sync" ] }
tokio-util = { version = "0.7", features = [ "rt" ] }
torrust-tracker-configuration = { version = "3.0.0", path = "../configuration" }
torrust-located-error = "3.0.0"
tracing = "0"

[dev-dependencies]
axum = "0.8.9"
rustls = { version = "0.23", default-features = false, features = [ "ring" ] }
tokio-rustls = { version = "0.26", default-features = false, features = [ "ring" ] }
tokio = { version = "1", features = [ "io-util", "test-util" ] }
