[package]
authors.workspace = true
categories = [ "web-programming::http-server" ]
description = "Axum transport layer of the Torrust Tracker management REST API."
edition.workspace = true
homepage.workspace = true
keywords = [ "axum", "bittorrent", "http", "openapi", "rest" ]
license.workspace = true
name = "torrust-tracker-axum-rest-api-server"
publish.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[lints]
workspace = true

[features]
default = [  ]
# Test support outside the semver guarantees of this package: the REST API test environment in `src/testing/`, which
# the tests of other workspace packages use. Never enable it from a `[dependencies]` entry.
testing = [
  "dep:torrust-clock",
  "dep:torrust-tracker-core",
  "dep:torrust-tracker-http-core",
  "dep:torrust-tracker-rest-api-client",
  "dep:torrust-tracker-swarm-coordination-registry",
  "dep:torrust-tracker-udp-core",
  "dep:torrust-tracker-udp-server",
]

[dependencies]
axum = { version = "0", features = [ "macros" ] }
axum-extra = { version = "0", features = [ "query" ] }
axum-server = { version = "0", features = [ "tls-rustls-no-provider" ] }
torrust-tracker-http-core = { version = "0.1.0", path = "../http-core", optional = true }
torrust-info-hash = "=0.2.0"
torrust-tracker-core = { version = "0.1.0", path = "../tracker-core", optional = true }
torrust-tracker-udp-core = { version = "0.1.0", path = "../udp-core", optional = true }
derive_more = { version = "2", features = [ "as_ref", "constructor", "from" ] }
futures = "0"
hyper = "1"
reqwest = { version = "0", features = [ "json" ] }
secrecy = "0.10"
serde = { version = "1", features = [ "derive" ] }
serde_json = { version = "1", features = [ "preserve_order" ] }
subtle = "2.6.1"
thiserror = "2"
tokio = { version = "1", features = [ "macros", "net", "rt-multi-thread", "signal", "sync" ] }
tokio-util = "0.7.15"
torrust-tracker-axum-server = { version = "0.1.0", path = "../axum-server" }
torrust-tracker-rest-api-client = { version = "0.1.0", path = "../rest-api-client", optional = true }
torrust-tracker-rest-api-application = { version = "0.1.0", path = "../rest-api-application" }
torrust-tracker-rest-api-protocol = { version = "0.1.0", path = "../rest-api-protocol" }
torrust-tracker-rest-api-runtime-adapter = { version = "0.1.0", path = "../rest-api-runtime-adapter" }
torrust-server-lib = "0.5.0"
torrust-clock = { version = "3.0.0", optional = true }
torrust-tracker-configuration = { version = "3.0.0", path = "../configuration" }
torrust-metrics = "0.2.0"
torrust-net-primitives = "0.1.0"
torrust-tracker-primitives = { version = "3.0.0", path = "../primitives" }
torrust-tracker-swarm-coordination-registry = { version = "0.1.0", path = "../swarm-coordination-registry", optional = true }
torrust-tracker-udp-server = { version = "0.1.0", path = "../udp-server", optional = true }
tower = { version = "0", features = [ "timeout" ] }
tower-http = { version = "0", features = [ "compression-full", "cors", "propagate-header", "request-id", "trace" ] }
tracing = "0"
url = "2"

[dev-dependencies]
async-trait = "0.1"
torrust-tracker-axum-rest-api-server = { path = ".", features = [ "testing" ] }
rstest = { version = "0.28.0", default-features = false }
rustls = { version = "0.23", default-features = false, features = [ "ring" ] }
tempfile = "3.27.0"
torrust-tracker-rest-api-client = { version = "0.1.0", path = "../rest-api-client" }
torrust-tracker-test-helpers = { version = "3.0.0", path = "../test-helpers" }
tower = { version = "0", features = [ "util" ] }
url = { version = "2", features = [ "serde" ] }
uuid = { version = "1", features = [ "v4" ] }
