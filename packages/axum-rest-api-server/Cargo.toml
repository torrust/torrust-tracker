[package]
authors.workspace = true
description = "The Torrust Tracker API."
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords = [ "axum", "bittorrent", "http", "server", "torrust", "tracker" ]
license.workspace = true
name = "torrust-tracker-axum-rest-api-server"
publish.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
axum = { version = "0", features = [ "macros" ] }
axum-extra = { version = "0", features = [ "query" ] }
axum-server = { version = "0", features = [ "tls-rustls-no-provider" ] }
torrust-tracker-http-core = { version = "3.0.0-develop", path = "../http-core" }
torrust-info-hash = "=0.2.0"
torrust-tracker-core = { version = "3.0.0-develop", path = "../tracker-core" }
torrust-tracker-udp-core = { version = "3.0.0-develop", path = "../udp-core" }
derive_more = { version = "2", features = [ "as_ref", "constructor", "from" ] }
futures = "0"
hyper = "1"
reqwest = { version = "0", features = [ "json" ] }
serde = { version = "1", features = [ "derive" ] }
serde_json = { version = "1", features = [ "preserve_order" ] }
serde_with = { version = "3", features = [ "json" ] }
thiserror = "2"
tokio = { version = "1", features = [ "macros", "net", "rt-multi-thread", "signal", "sync" ] }
torrust-tracker-axum-server = { version = "3.0.0-develop", path = "../axum-server" }
torrust-tracker-rest-api-client = { version = "3.0.0-develop", path = "../rest-api-client" }
torrust-tracker-rest-api-core = { version = "3.0.0-develop", path = "../rest-api-core" }
torrust-tracker-rest-api-protocol = { version = "3.0.0-develop", path = "../rest-api-protocol" }
torrust-server-lib = "0.1.0"
torrust-clock = "3.0.0"
torrust-tracker-configuration = { version = "3.0.0-develop", path = "../configuration" }
torrust-metrics = "0.1.0"
torrust-net-primitives = "0.1.0"
torrust-tracker-primitives = { version = "3.0.0-develop", path = "../primitives" }
torrust-tracker-swarm-coordination-registry = { version = "3.0.0-develop", path = "../swarm-coordination-registry" }
torrust-tracker-udp-server = { version = "3.0.0-develop", path = "../udp-server" }
tower = { version = "0", features = [ "timeout" ] }
tower-http = { version = "0", features = [ "compression-full", "cors", "propagate-header", "request-id", "trace" ] }
tracing = "0"
url = "2"

[dev-dependencies]
torrust-tracker-rest-api-client = { version = "3.0.0-develop", path = "../rest-api-client" }
torrust-tracker-test-helpers = { version = "3.0.0-develop", path = "../test-helpers" }
url = { version = "2", features = [ "serde" ] }
uuid = { version = "1", features = [ "v4" ] }
