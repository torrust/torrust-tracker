[package]
authors.workspace = true
description = "The Torrust Bittorrent HTTP tracker."
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords = [ "axum", "bittorrent", "healthcheck", "http", "server", "torrust", "tracker" ]
license.workspace = true
name = "torrust-tracker-axum-health-check-api-server"
publish.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[dependencies]
axum = { version = "0", features = [ "macros" ] }
axum-server = { version = "0", features = [ "tls-rustls-no-provider" ] }
futures = "0"
hyper = "1"
serde = { version = "1", features = [ "derive" ] }
serde_json = { version = "1", features = [ "preserve_order" ] }
tokio = { version = "1", features = [ "macros", "net", "rt-multi-thread", "signal", "sync" ] }
torrust-tracker-axum-server = { version = "0.1.0", path = "../axum-server" }
torrust-server-lib = "0.2.0"
torrust-tracker-primitives = { version = "3.0.0", path = "../primitives" }
torrust-tracker-configuration = { version = "3.0.0", path = "../configuration" }
torrust-net-primitives = "0.1.0"
tower-http = { version = "0", features = [ "compression-full", "cors", "propagate-header", "request-id", "trace" ] }
tracing = "0"
url = "2.5.4"

[dev-dependencies]
reqwest = { version = "0", features = [ "json" ] }
torrust-tracker-axum-health-check-api-server = { version = "0.1.0", path = "../axum-health-check-api-server" }
torrust-tracker-axum-http-server = { version = "0.1.0", path = "../axum-http-server" }
torrust-tracker-axum-rest-api-server = { version = "0.1.0", path = "../axum-rest-api-server" }
torrust-clock = "3.0.0"
torrust-tracker-test-helpers = { version = "3.0.0", path = "../test-helpers" }
torrust-tracker-udp-server = { version = "0.1.0", path = "../udp-server" }
