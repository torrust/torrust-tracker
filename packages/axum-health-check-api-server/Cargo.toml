[package]
authors.workspace = true
description = "The Torrust Bittorrent HTTP tracker."
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords = [ "axum", "bittorrent", "healthcheck", "http", "server", "torrust", "tracker" ]
license.workspace = true
name = "torrust-tracker-axum-health-check-api-server"
publish.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true
version = "0.2.0"

[lints]
workspace = true

[features]
default = [  ]
# Test support outside the semver guarantees of this package: the health check API test environment in
# `src/environment.rs`, which the package's own tests use. Never enable it from a `[dependencies]` entry.
testing = [ "dep:torrust-tracker-configuration" ]

[dependencies]
axum = { version = "0", features = [ "macros" ] }
axum-server = { version = "0", features = [ "tls-rustls-no-provider" ] }
futures = "0"
hyper = "1"
serde = { version = "1", features = [ "derive" ] }
serde_json = { version = "1", features = [ "preserve_order" ] }
thiserror = "2"
tokio = { version = "1", features = [ "macros", "net", "rt-multi-thread", "signal", "sync" ] }
tokio-util = "0.7.15"
torrust-tracker-axum-server = { version = "0.1.0", path = "../axum-server" }
torrust-server-lib = "0.5.0"
torrust-tracker-primitives = { version = "3.0.0", path = "../primitives" }
torrust-tracker-configuration = { version = "3.0.0", path = "../configuration", optional = true }
torrust-net-primitives = "0.1.0"
tower-http = { version = "0", features = [ "compression-full", "cors", "propagate-header", "request-id", "trace" ] }
tracing = "0"
url = { version = "2.5.4", features = [ "serde" ] }

[dev-dependencies]
reqwest = { version = "0", features = [ "json" ] }
rustls = { version = "0.23", default-features = false, features = [ "ring" ] }
torrust-tracker-axum-health-check-api-server = { path = ".", features = [ "testing" ] }
torrust-tracker-axum-http-server = { version = "0.1.0", path = "../axum-http-server", features = [ "testing" ] }
torrust-tracker-axum-rest-api-server = { version = "0.1.0", path = "../axum-rest-api-server", features = [ "testing" ] }
torrust-clock = "3.0.0"
torrust-tracker-test-helpers = { version = "3.0.0", path = "../test-helpers" }
torrust-tracker-udp-server = { version = "0.1.0", path = "../udp-server", features = [ "testing" ] }
