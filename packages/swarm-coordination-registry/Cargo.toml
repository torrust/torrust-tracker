[package]
categories = [ "data-structures", "network-programming" ]
description = "In-memory registry of the torrent swarms and peers tracked by the Torrust Tracker."
keywords = [ "bittorrent", "concurrency", "in-memory", "peers", "torrents" ]
name = "torrust-tracker-swarm-coordination-registry"
readme = "README.md"

authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[lints]
workspace = true

[dependencies]
torrust-info-hash = "=0.2.0"
chrono = { version = "0", default-features = false, features = [ "clock" ] }
crossbeam-skiplist = "0"
futures = "0"
serde = { version = "1.0.219", features = [ "derive" ] }
tokio = { version = "1", features = [ "macros", "net", "rt-multi-thread", "sync" ] }
tokio-util = "0.7.15"
torrust-clock = "3.0.0"
torrust-tracker-events = { version = "0.1.0", path = "../events" }
torrust-metrics = "0.2.0"
torrust-tracker-primitives = { version = "3.0.0", path = "../primitives" }
tracing = "0"

[dev-dependencies]
mockall = "0"
rstest = "0"
tokio = { version = "1", features = [ "test-util" ] }
