[package]
description = "A library with the primitive types and functions for the BitTorrent HTTP tracker protocol."
keywords = [ "api", "library", "primitives" ]
name = "torrust-tracker-http-tracker-protocol"
readme = "README.md"

authors.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
torrust-tracker-udp-tracker-protocol = { version = "3.0.0-develop", path = "../udp-protocol" }
bittorrent-primitives = "0.2.0"
derive_more = { version = "2", features = [ "as_ref", "constructor", "from" ] }
multimap = "0"
percent-encoding = "2"
serde = { version = "1", features = [ "derive" ] }
serde_bencode = "0"
thiserror = "2"
torrust-clock = { version = "3.0.0-develop", path = "../clock" }
torrust-tracker-contrib-bencode = { version = "3.0.0-develop", path = "../../contrib/bencode" }
torrust-located-error = { version = "3.0.0-develop", path = "../located-error" }
torrust-tracker-primitives = { version = "3.0.0-develop", path = "../primitives" }
