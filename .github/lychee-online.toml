# Check external URLs without the offline policy required for local pre-commit validation.
offline = false

# Preserve maintained-document local-anchor validation during the online check.
include_fragments = "full"

# Avoid immutable historical records and byte-identical external source snapshots.
exclude_path = [
  "(^|/)docs/external-snapshots/.*/(LICENSE|SPEC)\\.md$",
  "(^|/)docs/issues/closed/",
]

# GitHub renders PR review and issue-comment anchors dynamically, so Lychee cannot
# reliably validate them. The Star History project selector is also client-side.
# Keep all other GitHub URLs, fragments, and Star History targets checked.
exclude = [
  "^https://github\\.com/torrust/torrust-tracker/issues/[0-9]+#issuecomment-[0-9]+$",
  "^https://github\\.com/torrust/torrust-tracker/pull/[0-9]+#discussion_r[0-9]+$",
  "^https://github\\.com/torrust/torrust-tracker/pull/[0-9]+#issuecomment-[0-9]+$",
  "^https://github\\.com/torrust/torrust-tracker/pull/[0-9]+#pullrequestreview-[0-9]+$",
  # Unfilled reply-URL placeholder in a recorded PR review (docs/pr-reviews/pr-2486-review).
  "^https://github\\.com/torrust/torrust-tracker/pull/2486#issuecomment-\\{response-R3\\}$",
  # Pages that need repository admin authentication return 404 to anonymous runners.
  "^https://github\\.com/torrust/torrust-tracker/security/code-scanning/[0-9]+$",
  "^https://github\\.com/torrust/torrust-tracker/settings/",
  # Stack Overflow rejects automated clients with 403 (docs/containers.md).
  "^https://stackoverflow\\.com/a/56768087/3012842$",
  # Medium rejects automated clients with 403 (write-unit-test skill).
  "^https://medium\\.com/@kentbeck_7670/(test-desiderata-94150638a4b3|programmer-test-principles-d01c064d7934)$",
  # The runner cannot complete the TLS handshake with www.fsf.org (HandshakeFailure).
  "^https://www\\.fsf\\.org/$",
  "^https://star-history\\.dera\\.page/#torrust/torrust-tracker$",
]

# Localhost and loopback examples are intentionally unavailable to hosted runners.
# This preserves checking for all non-loopback URLs, including public addresses.
exclude_loopback = true

# Bound requests to respect external services while retaining actionable failures.
timeout = 20
max_retries = 2
retry_wait_time = 2
max_concurrency = 4
host_request_interval = "1s"
