[package]
description = "Block until a reviewer event happens on a pull request, using the GitHub CLI."
name = "wait-for-pr-review"
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version = "0.1.0"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = [ "derive" ] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
signal-hook = { version = "0.4", default-features = false }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
