name: Generate Coverage Report (PR)

# skill-link: update-github-workflow-actions
# Path policy: skip this workflow when every changed file is documentation.
# See .github/workflows/docs-lint.yaml for the lightweight docs-only workflow.
on:
  pull_request:
    branches:
      - develop
    paths-ignore:
      - "**/*.md"
      - "project-words.txt"

env:
  CARGO_TERM_COLOR: always

jobs:
  discover-package-coverage:
    name: Discover Package Coverage
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      unavailable: ${{ steps.discover.outputs.unavailable }}

    steps:
      - name: Checkout base revision
        uses: actions/checkout@v7.0.1
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Checkout head revision
        uses: actions/checkout@v7.0.1
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - id: setup
        name: Setup Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly

      - id: discover
        name: Discover Changed Packages
        working-directory: head
        run: |
          discovery=$(cargo run -p package-coverage-regression -- matrix \
            "$GITHUB_WORKSPACE/base" \
            "$GITHUB_WORKSPACE/head" \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          echo "matrix=$(jq -c .matrix <<< "$discovery")" >> "$GITHUB_OUTPUT"
          echo "unavailable=$(jq -c .unavailable <<< "$discovery")" >> "$GITHUB_OUTPUT"

  package-coverage-regression:
    name: Package Coverage (${{ matrix.package }})
    needs: discover-package-coverage
    if: ${{ needs.discover-package-coverage.outputs.matrix != '{"include":[]}' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-package-coverage.outputs.matrix) }}
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-Cinstrument-coverage"

    steps:
      - name: Checkout base revision
        uses: actions/checkout@v7.0.1
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Checkout head revision
        uses: actions/checkout@v7.0.1
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha }}

      - id: setup
        name: Setup Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - id: tools
        name: Install Tools
        uses: taiki-e/install-action@v2.87.14
        with:
          tool: cargo-llvm-cov

      - name: Generate Base Coverage Report
        working-directory: base
        run: cargo llvm-cov -p "${{ matrix.package }}" --all-features --codecov --output-path "$GITHUB_WORKSPACE/base-codecov.json"

      - name: Generate Head Coverage Report
        working-directory: head
        run: cargo llvm-cov -p "${{ matrix.package }}" --all-features --codecov --output-path "$GITHUB_WORKSPACE/head-codecov.json"

      - name: Compare Package Coverage
        working-directory: head
        run: |
          cargo run -p package-coverage-regression -- compare \
            "${{ matrix.package }}" \
            "$GITHUB_WORKSPACE/base-codecov.json" \
            "$GITHUB_WORKSPACE/base/${{ matrix.base_directory }}/src" \
            "$GITHUB_WORKSPACE/head-codecov.json" \
            "$GITHUB_WORKSPACE/head/${{ matrix.head_directory }}/src" \
            > "$GITHUB_WORKSPACE/package-coverage-${{ matrix.package }}.json"

      - name: Store Package Coverage Result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: package-coverage-${{ matrix.package }}
          path: package-coverage-${{ matrix.package }}.json
          if-no-files-found: ignore

  package-coverage-summary:
    name: Package Coverage Regression
    needs: [discover-package-coverage, package-coverage-regression]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Download Package Coverage Results
        if: ${{ needs.package-coverage-regression.result != 'skipped' }}
        uses: actions/download-artifact@v5
        with:
          pattern: package-coverage-*
          path: package-coverage-results
          merge-multiple: true

      - name: Write Report-Only Summary
        env:
          MATRIX: ${{ needs.discover-package-coverage.outputs.matrix }}
          UNAVAILABLE: ${{ needs.discover-package-coverage.outputs.unavailable }}
        run: |
          {
            echo "## Package Coverage Regression"
            echo
            echo "This report is informational and does not block merging."
            echo
            if [[ "$MATRIX" == '{"include":[]}' && "$UNAVAILABLE" == '[]' ]]; then
              echo "No directly changed workspace package was selected."
              exit 0
            fi
            echo "| Package | Base | Head | Delta | Warning |"
            echo "| --- | ---: | ---: | ---: | --- |"
            while IFS=$'\t' read -r package base_directory head_directory; do
              result="package-coverage-results/package-coverage-$package.json"
              if [[ ! -f "$result" ]]; then
                echo "| $package | unavailable | unavailable | unavailable | comparison unavailable |"
                continue
              fi
              base_covered=$(jq -r '.base.covered_lines' "$result")
              base_instrumented=$(jq -r '.base.instrumented_lines' "$result")
              head_covered=$(jq -r '.head.covered_lines' "$result")
              head_instrumented=$(jq -r '.head.instrumented_lines' "$result")
              base="$base_covered/$base_instrumented ($(awk -v covered="$base_covered" -v instrumented="$base_instrumented" 'BEGIN { printf "%.2f%%", (covered * 100) / instrumented }'))"
              head="$head_covered/$head_instrumented ($(awk -v covered="$head_covered" -v instrumented="$head_instrumented" 'BEGIN { printf "%.2f%%", (covered * 100) / instrumented }'))"
              delta=$(awk \
                -v base_covered="$base_covered" -v base_instrumented="$base_instrumented" \
                -v head_covered="$head_covered" -v head_instrumented="$head_instrumented" \
                'BEGIN { printf "%+.2f pp", ((head_covered * 100) / head_instrumented) - ((base_covered * 100) / base_instrumented) }')
              warning=$(jq -r '.warning' "$result")
              echo "| $package | $base | $head | $delta | $warning |"
            done < <(jq -r '.include[] | "\(.package)\t\(.base_directory)\t\(.head_directory)"' <<< "$MATRIX")
            while IFS=$'\t' read -r package outcome; do
              echo "| $package | unavailable | unavailable | unavailable | $outcome |"
            done < <(jq -r '.[] | "\(.package)\t\(.outcome)"' <<< "$UNAVAILABLE")
          } >> "$GITHUB_STEP_SUMMARY"

  coverage:
    name: Generate Coverage Report
    environment: coverage
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-Cinstrument-coverage"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install LLVM tools
        run: sudo apt-get update && sudo apt-get install -y llvm

      - id: setup
        name: Setup Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - id: cache
        name: Enable Workflow Cache
        uses: Swatinem/rust-cache@v2.9.2

      - id: tools
        name: Install Tools
        uses: taiki-e/install-action@v2.87.14
        with:
          tool: grcov,cargo-llvm-cov

      - id: coverage
        name: Generate Coverage Report
        run: |
          cargo clean
          cargo llvm-cov --all-features --workspace --codecov --output-path ./codecov.json

      - name: Store PR number and commit SHA
        run: |
          echo "Storing PR number ${{ github.event.number }}"
          echo "${{ github.event.number }}" > pr_number.txt

          echo "Storing commit SHA ${{ github.event.pull_request.head.sha }}"
          echo "${{ github.event.pull_request.head.sha }}" > commit_sha.txt

      # Workaround for https://github.com/orgs/community/discussions/25220
      # Triggered sub-workflow is not able to detect the original commit/PR which is available
      # in this workflow.
      - name: Store PR number
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pr_number
          path: pr_number.txt

      - name: Store commit SHA
        uses: actions/upload-artifact@v7.0.1
        with:
          name: commit_sha
          path: commit_sha.txt

      # This stores the coverage report in artifacts. The actual upload to Codecov
      # is executed by a different workflow `upload_coverage.yml`. The reason for this
      # split is because `on.pull_request` workflows don't have access to secrets.
      - name: Store coverage report in artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: codecov_report
          path: ./codecov.json

      - run: |
          echo "The coverage report was stored in Github artifacts."
          echo "It will be uploaded to Codecov using [upload_coverage.yml] workflow shortly."
