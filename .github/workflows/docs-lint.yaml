# Docs-Lint Workflow
#
# Runs lightweight documentation checks on every push and pull request.
# Serves as the required CI signal for documentation-only pull requests,
# which are excluded from the heavyweight test and compatibility workflows
# via `paths-ignore` rules in those workflows.
#
# "Docs-only" path policy (mirrored in the `paths-ignore` lists of
# testing.yaml, os-compatibility.yaml, container.yaml, and
# generate_coverage_pr.yaml; db-compatibility.yaml and db-benchmarking.yaml
# are already scoped to code paths via `paths:` inclusion rules):
#   - **/*.md        — all Markdown files (docs/, READMEs, AGENTS.md, SKILL.md, …)
#   - project-words.txt — spell-check dictionary (documentation artefact)
#
# A pull request is treated as docs-only when every changed file matches
# one of the patterns above. Mixed pull requests (docs + code) still run
# the full CI matrix because the code-side changes escape `paths-ignore`.

name: Docs Lint

# skill-link: update-github-workflow-actions

on:
  push:
  pull_request:

jobs:
  docs:
    name: Docs Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - id: checkout
        name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - id: setup
        name: Setup Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - id: node
        name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "20"

      - id: cache
        name: Enable Job Cache
        uses: Swatinem/rust-cache@v2.9.3

      - id: linter
        name: Install Internal Linter
        run: cargo install --locked torrust-linting@0.2.0 --bin linter

      - id: lint-links
        name: Check Local Documentation Links
        run: linter lychee

      - id: lint-markdown
        name: Lint Markdown
        run: linter markdown

      - id: lint-spelling
        name: Check Spelling
        run: linter cspell

      # issue: #2866
      # Claude Code discovers a project skill only at `.claude/skills/<name>/SKILL.md`. The check also
      # keeps the redirect stubs under `.github/skills/`, their inventory, and the skills index in step.
      - id: skill-layout
        name: Check Agent Skill Layout
        run: cargo run --quiet --package frontmatter-validator --bin frontmatter-validator -- --skill-layout

      # issue: #2873
      # Claude Code loads every skill's description into every session, within 1% of the context
      # window. The check keeps each description whole (not cut by a YAML comment) and within 200
      # characters.
      - id: skill-descriptions
        name: Check Agent Skill Descriptions
        run: cargo run --quiet --package frontmatter-validator --bin frontmatter-validator -- --skill-descriptions

      # issue: #2904
      # Agents write one JSON reply file per reply in `agent-replies/` of an issue specification
      # (D18). The check validates every such file: its place, its name, its content against the
      # `agent-reply-v1` schema, and that the name agrees with the content.
      - id: agent-replies
        name: Check Agent Reply Files
        run: cargo run --quiet --package agent-reply-validator --bin agent-reply-validator -- --all
