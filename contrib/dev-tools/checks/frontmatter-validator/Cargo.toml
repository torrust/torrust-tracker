[package]
description = "Validation primitives for Markdown frontmatter."
name = "frontmatter-validator"
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version = "0.1.0"

[lints]
workspace = true

[dependencies]
# Pinned: registry 1.2.2 requires schemars_derive 1.2.2, which is not published.
schemars = "=1.2.1"
serde = { version = "1", features = [ "derive" ] }
serde_json = { version = "1", features = [ "preserve_order" ] }
serde_yaml = "0.9.34"
tempfile = "3"
thiserror = "2"
