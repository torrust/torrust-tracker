[package]
description = "Generates a workspace coupling report for the Torrust Tracker workspace."
name = "workspace-coupling"
publish = false

authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
syn = { version = "2", features = [ "full", "visit" ] }
walkdir = "2"
