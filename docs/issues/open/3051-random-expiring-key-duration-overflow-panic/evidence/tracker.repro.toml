[metadata]
app = "torrust-tracker"
purpose = "configuration"
schema_version = "3.0.0"

[logging]
trace_filter = "info"
trace_style = "full"

[core]
listed = false
private = true

[core.database]
driver = "sqlite3"
path = "./.tmp/repro-keys.db"

[http_api]
bind_address = "127.0.0.1:18212"

[http_api.access_tokens]
admin = "ReproToken"
