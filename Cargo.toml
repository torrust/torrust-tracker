[package]
default-run = "torrust-tracker"
name = "torrust-tracker"
readme = "README.md"

authors.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version = "3.0.0-develop"

[lib]
name = "torrust_tracker_lib"

[[test]]
name = "metrics-fixed-ports"
path = "tests/metrics/fixed_ports.rs"

[[test]]
name = "metrics-port-zero"
path = "tests/metrics/port_zero.rs"

[[test]]
name = "metrics-udp-error-enabled-port-zero"
path = "tests/metrics/udp_error_enabled_port_zero.rs"

[[test]]
name = "metrics-udp-error-disabled-port-zero"
path = "tests/metrics/udp_error_disabled_port_zero.rs"

[[test]]
name = "banning-udp-metrics-disabled-port-zero"
path = "tests/banning/udp_metrics_disabled_port_zero.rs"

[[test]]
name = "banning-udp-shared-connection-id-error-limit"
path = "tests/banning/udp_shared_connection_id_error_limit.rs"

[[test]]
name = "banning-udp-shared-connection-id-error-limit-reverse-order"
path = "tests/banning/udp_shared_connection_id_error_limit_reverse_order.rs"

[[test]]
name = "lifecycle-signals"
path = "tests/lifecycle/signals.rs"

[lints]
workspace = true

[workspace.package]
authors = [ "Nautilus Cyberneering <info@nautilus-cyberneering.de>, Mick van Dijke <mick@dutchbits.nl>" ]
categories = [ "network-programming", "web-programming" ]
description = "A feature rich BitTorrent tracker."
documentation = "https://docs.rs/crate/torrust-tracker/"
edition = "2024"
homepage = "https://torrust.com/"
keywords = [ "bittorrent", "file-sharing", "peer-to-peer", "torrent", "tracker" ]
license = "AGPL-3.0-only"
publish = true
repository = "https://github.com/torrust/torrust-tracker"
rust-version = "1.88"

[dependencies]
anyhow = "1"
axum-server = { version = "0", features = [ "tls-rustls-no-provider" ] }
base64 = "0.22.1"
torrust-tracker-http-core = { version = "0.1.0", path = "packages/http-core" }
torrust-tracker-core = { version = "0.1.0", path = "packages/tracker-core" }
torrust-tracker-udp-core = { version = "0.1.0", path = "packages/udp-core" }
chrono = { version = "0", default-features = false, features = [ "clock" ] }
clap = { version = "4", features = [ "derive", "env" ] }
pbkdf2 = "0.13.0"
rand = "0"
regex = "1"
reqwest = { version = "0", features = [ "json", "multipart" ] }
secrecy = "0.10.3"
serde = { version = "1", features = [ "derive" ] }
serde_json = { version = "1", features = [ "preserve_order" ] }
sha1 = "0.11.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.12"
tokio = { version = "1", features = [ "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time" ] }
tokio-util = "0.7.15"
torrust-tracker-axum-health-check-api-server = { version = "0.1.0", path = "packages/axum-health-check-api-server" }
torrust-tracker-axum-http-server = { version = "0.1.0", path = "packages/axum-http-server" }
torrust-tracker-axum-rest-api-server = { version = "0.1.0", path = "packages/axum-rest-api-server" }
torrust-tracker-axum-server = { version = "0.1.0", path = "packages/axum-server" }
torrust-tracker-rest-api-client = { version = "0.1.0", path = "packages/rest-api-client" }
torrust-tracker-rest-api-runtime-adapter = { version = "0.1.0", path = "packages/rest-api-runtime-adapter" }
torrust-tracker-rest-api-protocol = { version = "0.1.0", path = "packages/rest-api-protocol" }
torrust-server-lib = "0.2.0"
torrust-clock = "3.0.0"
torrust-tracker-configuration = { version = "3.0.0", path = "packages/configuration" }
torrust-tracker-primitives = { version = "3.0.0", path = "packages/primitives" }
torrust-tracker-swarm-coordination-registry = { version = "0.1.0", path = "packages/swarm-coordination-registry" }
torrust-tracker-udp-server = { version = "0.1.0", path = "packages/udp-server" }
tracing = "0"
tracing-subscriber = { version = "0", features = [ "json" ] }

[dev-dependencies]
torrust-net-primitives = "0.1.0"
torrust-tracker-test-helpers = { version = "3.0.0", path = "packages/test-helpers" }
url = { version = "2", features = [ "serde" ] }

[target.'cfg(unix)'.dev-dependencies]
# `nix` provides typed, safe delivery of POSIX signals to the exact child PID.
nix = { version = "0.31.3", default-features = false, features = [ "signal" ] }

[workspace]
members = [
  "console/tracker-client",
  "contrib/dev-tools/analysis/workspace-coupling",
  "packages/e2e-tools",
  "packages/persistence-benchmark",
  "packages/rest-api-application",
  "packages/rest-api-protocol",
  "packages/rest-api-runtime-adapter",
  "packages/torrent-repository-benchmarking",
]

[workspace.lints.rust]
deprecated_safe = { level = "deny", priority = -2 }
future_incompatible = { level = "deny", priority = -2 }
let_underscore = { level = "deny", priority = -2 }
nonstandard_style = { level = "deny", priority = -2 }
rust_2018_compatibility = { level = "deny", priority = -2 }
rust_2018_idioms = { level = "deny", priority = -2 }
rust_2021_compatibility = { level = "deny", priority = -2 }
rust_2024_compatibility = { level = "deny", priority = -2 }
unsafe_code = { level = "warn", priority = 0 }
unused = { level = "deny", priority = -2 }
warnings = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cognitive_complexity = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
exit = { level = "deny", priority = 0 }
nursery = { level = "warn", priority = -2 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
print_stderr = { level = "deny", priority = 0 }
print_stdout = { level = "deny", priority = 0 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

[profile.dev]
debug = 1
opt-level = 1

[profile.release]
debug = 1
lto = "fat"
opt-level = 3

[profile.release-debug]
debug = true
inherits = "release"
