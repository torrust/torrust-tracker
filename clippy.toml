# Every Axum listener must be built through `torrust_tracker_axum_server::custom_axum_server`, which
# applies the connection timeouts (the first-request timeout closes silent connections). A listener
# built with these `axum-server` constructors directly keeps idle connections open forever, which
# lets a flood of silent connections exhaust the process's file descriptors (issue #2776, EPIC
# #2411 case A2). See `packages/axum-server/docs/adrs/` and `packages/axum-server/README.md`.
#
# `custom_axum_server.rs` is the only place allowed to call them, with a documented `allow`.
disallowed-methods = [
  { path = "axum_server::from_tcp", reason = "build listeners with torrust_tracker_axum_server::custom_axum_server so they get the connection timeouts (#2776)" },
  { path = "axum_server::tls_rustls::from_tcp_rustls", reason = "build listeners with torrust_tracker_axum_server::custom_axum_server so they get the connection timeouts (#2776)" },
  { path = "axum_server::bind", reason = "build listeners with torrust_tracker_axum_server::custom_axum_server so they get the connection timeouts (#2776)" },
  { path = "axum_server::tls_rustls::bind_rustls", reason = "build listeners with torrust_tracker_axum_server::custom_axum_server so they get the connection timeouts (#2776)" },
  { path = "axum_server::Server::bind", reason = "build listeners with torrust_tracker_axum_server::custom_axum_server so they get the connection timeouts (#2776)" },
  { path = "axum_server::Server::from_listener", reason = "build listeners with torrust_tracker_axum_server::custom_axum_server so they get the connection timeouts (#2776)" },
]
